<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FieldRelay — Autonomous Field Operations Mission Control</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="FieldRelay places the maintenance calls a property manager doesn't have time to make, returns the answer as validated data, and refuses to commit anything without a person." />
    <meta name="theme-color" content="#0C0E13" />
    <!-- The Signal and Gate mark: an incident sends a call outward as two arcs
         and the call stops against a solid bar. Inline so the tab is correct on
         first paint with no extra request. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%230C0E13'/%3E%3Ccircle cx='9' cy='24' r='4' fill='%233B7DFF'/%3E%3Cpath d='M17 15.5a12 12 0 0 1 0 17' stroke='%23EDEFF2' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3Cpath d='M24.5 10a19.5 19.5 0 0 1 0 28' stroke='%23EDEFF2' stroke-width='4' stroke-linecap='round' fill='none' opacity='.45'/%3E%3Crect x='37' y='9' width='4.2' height='30' rx='2.1' fill='%23EDEFF2'/%3E%3C/svg%3E" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #0C0E13; color: #EDEFF2; }
      .bootstrap-status {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .bootstrap-status__panel {
        width: min(440px, 100%);
        padding: 24px;
        border: 1px solid #2B3240;
        border-radius: 16px;
        background: #141821;
        text-align: center;
      }
      .bootstrap-status__panel strong { display: block; margin-bottom: 8px; }
      .bootstrap-status__panel span { color: #9BA7BD; font-size: 14px; line-height: 1.5; }
    </style>
    <!-- Geist, not Inter. Inter is the single most recognisable typographic tell
         of generated UI; Geist is a true neo-grotesque with the tighter, more
         mechanical fit this console wants. Geist Mono carries every identifier,
         phone number and amount. Both fonts are bundled locally so the CSP
         cannot silently replace them in the deployed evaluator build. -->
  </head>
  <body>
    <app-root>
      <div class="bootstrap-status" role="status" aria-live="polite">
        <div class="bootstrap-status__panel">
          <strong>Loading FieldRelay</strong>
          <span>Connecting to the operations console. A cold start can take a few seconds.</span>
        </div>
      </div>
    </app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
