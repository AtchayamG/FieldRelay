server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  # Baseline security headers. The CSP is deliberately strict: the app loads no
  # third-party scripts, fonts or frames, so nothing needs to be allowed beyond
  # its own origin. 'unsafe-inline' for styles is required by Angular's
  # component style injection.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Only meaningful once the deployment terminates TLS, which the judge
  # environment's platform does.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Same-origin API. The browser never talks to the API host directly, so there
  # is no CORS surface and the session token never crosses an origin boundary.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location /health {
    proxy_pass http://api:3000/health;
  }

  # Hashed build assets are immutable; index.html must never be cached or a
  # returning judge gets a stale shell pointing at deleted chunks.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
