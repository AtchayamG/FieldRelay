name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fieldrelay:fieldrelay_ci@127.0.0.1:5432/fieldrelay
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fieldrelay
          POSTGRES_USER: fieldrelay
          POSTGRES_PASSWORD: fieldrelay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldrelay -d fieldrelay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm --filter fieldrelay-api db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify design tokens
        run: node scripts/check-tokens.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod
